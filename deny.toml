[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "unmaintained transitive dependency bincode 1.3.3 via syntect 5.3.0" },
    { id = "RUSTSEC-2024-0436", reason = "unmaintained transitive dependency paste 1.0.15 via ratatui 0.29.0" },
    { id = "RUSTSEC-2024-0320", reason = "unmaintained transitive dependency yaml-rust 0.4.5 via syntect 5.3.0" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    # spellbook (file-level weak copyleft)
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
